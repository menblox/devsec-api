name: Lint

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
          - name: copy reposit
            uses: actions/checkout@v3

          - name: install Py
            uses: actions/setup-python@v4
            with:
                python-version: '3.12'

          - name: install linters
            run: |
                python -m pip install --upgrade pip
                pip install bandit
                pip install -r requirements.txt

          - name: run black
            run: black --check .

          - name: run mypy
            run: mypy .

          - name: run bandit
            run: bandit -r . -x ./venv/ -x ./tests/

          - name: run tests
            run: pytest
    test:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v3

          - name: Install deps
            run: pip install -r requirements.txt pytest

          - name: Run tests
            run: pytest

    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3

          - name: Build Docker
            run: docker build -t devsec-api .

    gitleaks:
        runs-on: ubuntu-latest

        steps:
          - name: copy reposit
            uses: actions/checkout@v3
            with:
              fetch-depth: 0

          - name: run gitleaks
            uses: zricethezav/gitleaks-action@v1.5.0
            with:
              config-path: .gitleaks.toml

    trivy:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - uses: actions/checkout@v3

          - name: Build Docker image
            run: docker build -t devsec-api .

          - name: Scan Docker image
            uses: aquasecurity/trivy-action@master
            with:
              image-ref: "devsec-api"
